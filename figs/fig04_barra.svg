<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker><marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#404040" stroke-width="1.5"/></marker><pattern id="soilh" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8d8b9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8d6e3f" stroke-width="1" opacity="0.45"/></pattern><pattern id="conc" patternUnits="userSpaceOnUse" width="14" height="14"><rect width="14" height="14" fill="#ececec"/><circle cx="3" cy="4" r="1" fill="#9a9a9a"/><circle cx="10" cy="9" r="0.8" fill="#9a9a9a"/><circle cx="6" cy="12" r="0.6" fill="#9a9a9a"/></pattern></defs><rect width="1180" height="700" fill="#ffffff"/><rect x="0.00" y="0.00" width="1180.00" height="64.00" fill="#c00000" stroke="none" stroke-width="1.2" /><text x="30.00" y="30.00" font-size="19" text-anchor="start" fill="#ffffff" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Fig. 4 — POSIÇÃO DA BARRA: ENCOSTADA DO LADO DO SOLO — NÃO CENTRALIZAR</text><text x="30.00" y="52.00" font-size="13" text-anchor="start" fill="#ffffff" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">O cálculo usa d = 14 cm no bloco de 19 (barra a 5 cm da face do solo). O costume de obra é deixar a barra no meio do furo, com d = 9,5 cm.</text><rect x="60.00" y="92.00" width="520.00" height="360.00" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2" /><text x="320.00" y="122.00" font-size="17" text-anchor="middle" fill="#2e7d32" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">✔ COMO FOI CALCULADO</text><rect x="180.00" y="195.00" width="233.75" height="209.00" fill="#d9d9d9" stroke="#7f7f7f" stroke-width="1.4" /><rect x="218.50" y="233.50" width="156.75" height="132.00" fill="#bdd7ee" stroke="#2e75b6" stroke-width="1.2" rx="5"/><circle cx="296.88" cy="250.00" r="8.38" fill="#c00000" stroke="none" stroke-width="1"/><text x="296.88" y="183.00" font-size="12" text-anchor="middle" fill="#8d6e3f" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">▲ SOLO — face tracionada</text><text x="296.88" y="426.00" font-size="12" text-anchor="middle" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">▼ face externa — comprimida</text><line x1="296.88" y1="250.00" x2="150.00" y2="250.00" stroke="#404040" stroke-width="0.6" /><line x1="180.00" y1="404.00" x2="150.00" y2="404.00" stroke="#404040" stroke-width="0.6" /><line x1="154.00" y1="250.00" x2="154.00" y2="404.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="147.00" y="327.00" font-size="13" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 147.00 327.00)">d = 14,0 cm</text><line x1="296.88" y1="195.00" x2="439.75" y2="195.00" stroke="#404040" stroke-width="0.6" /><line x1="413.75" y1="250.00" x2="439.75" y2="250.00" stroke="#404040" stroke-width="0.6" /><line x1="435.75" y1="195.00" x2="435.75" y2="250.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="442.75" y="222.50" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 442.75 222.50)">5 cm</text><text x="461.75" y="259.50" font-size="11" text-anchor="start" fill="#2e75b6" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">graute entre a barra</text><text x="461.75" y="273.50" font-size="11" text-anchor="start" fill="#2e75b6" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">e a parede ≥ 1,5 cm</text><rect x="610.00" y="92.00" width="520.00" height="360.00" fill="#fdecea" stroke="#c00000" stroke-width="2" /><text x="870.00" y="122.00" font-size="17" text-anchor="middle" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">✘ BARRA CENTRALIZADA (erro de obra)</text><rect x="690.00" y="195.00" width="233.75" height="209.00" fill="#d9d9d9" stroke="#7f7f7f" stroke-width="1.4" /><rect x="728.50" y="233.50" width="156.75" height="132.00" fill="#bdd7ee" stroke="#2e75b6" stroke-width="1.2" rx="5"/><circle cx="806.88" cy="299.50" r="8.38" fill="#c00000" stroke="none" stroke-width="1"/><text x="806.88" y="183.00" font-size="12" text-anchor="middle" fill="#8d6e3f" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">▲ SOLO — face tracionada</text><text x="806.88" y="426.00" font-size="12" text-anchor="middle" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">▼ face externa — comprimida</text><line x1="806.88" y1="299.50" x2="660.00" y2="299.50" stroke="#404040" stroke-width="0.6" /><line x1="690.00" y1="404.00" x2="660.00" y2="404.00" stroke="#404040" stroke-width="0.6" /><line x1="664.00" y1="299.50" x2="664.00" y2="404.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="657.00" y="351.75" font-size="13" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 657.00 351.75)">d = 9,5 cm</text><line x1="806.88" y1="195.00" x2="949.75" y2="195.00" stroke="#404040" stroke-width="0.6" /><line x1="923.75" y1="299.50" x2="949.75" y2="299.50" stroke="#404040" stroke-width="0.6" /><line x1="945.75" y1="195.00" x2="945.75" y2="299.50" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="952.75" y="247.25" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 952.75 247.25)">9,5 cm</text><text x="60.00" y="490.00" font-size="15" text-anchor="start" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Por que importa</text><text x="60.00" y="518.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• O braço de alavanca cai cerca de 1/3. Num balanço de 1,6 m em bloco 19, o As necessário passa de 1,52 para 2,46 cm²/m e o Ø10 c/40 deixa de atender.</text><text x="60.00" y="542.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• A planilha mostra isso na aba Muro em balanço, em "E se a barra for centralizada na obra?". Se der NÃO, o projeto depende da barra encostada.</text><text x="60.00" y="574.00" font-size="15" text-anchor="start" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Como garantir na obra</text><text x="60.00" y="598.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• Indicar em planta, no corte e nas notas: "armadura vertical encostada na face do solo — não centralizar".</text><text x="60.00" y="622.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• Espaçador ou gabarito na espera e na barra; amarrar a barra na espera; conferir a posição antes de grautear.</text><text x="60.00" y="685.00" font-size="11" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">Campo das Entradas: "d (altura útil) — opcional" (em branco = barra no meio, d = t/2).</text></svg>