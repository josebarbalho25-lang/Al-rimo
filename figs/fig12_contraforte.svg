 l (eixo a eixo) — intermediário</text><line x1="685.00" y1="488.00" x2="685.00" y2="512.00" stroke="#404040" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="1075.00" y1="488.00" x2="1075.00" y2="512.00" stroke="#404040" stroke-width="0.8" stroke-dasharray="3,3"/><line x1="590.00" y1="85.00" x2="590.00" y2="520.00" stroke="#bfbfbf" stroke-width="1" /><text x="30.00" y="555.00" font-size="11" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">Campos das Entradas: Posição do contraforte, Comprimento (tenr), Espessura (eenr), Espaçamento entre contrafortes, Ø/nº de barras, estribo. Extremidade: largura = l/2 + balanço.</text></svg>