e Libânio, γ = h/l)</text><text x="730.00" y="148.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Mdyei</text><text x="792.00" y="148.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">vertical, na base (engaste): traciona a face do SOLO</text><text x="730.00" y="170.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Mdy</text><text x="792.00" y="170.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">vertical, no vão: traciona a face EXTERNA</text><text x="730.00" y="192.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Mdx</text><text x="792.00" y="192.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">horizontal, no vão</text><text x="730.00" y="214.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Mdxb</text><text x="792.00" y="214.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">horizontal, na borda livre (topo)</text><text x="730.00" y="236.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Mdxe</text><text x="792.00" y="236.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">horizontal, no contraforte (só lateral engastada)</text><text x="730.00" y="275.00" font-size="15" text-anchor="start" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Armaduras do exemplo</text><text x="730.00"