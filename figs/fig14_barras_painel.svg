<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker><marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#404040" stroke-width="1.5"/></marker><pattern id="soilh" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#e8d8b9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8d6e3f" stroke-width="1" opacity="0.45"/></pattern><pattern id="conc" patternUnits="userSpaceOnUse" width="14" height="14"><rect width="14" height="14" fill="#ececec"/><circle cx="3" cy="4" r="1" fill="#9a9a9a"/><circle cx="10" cy="9" r="0.8" fill="#9a9a9a"/><circle cx="6" cy="12" r="0.6" fill="#9a9a9a"/></pattern></defs><rect width="1180" height="640" fill="#ffffff"/><rect x="0.00" y="0.00" width="1180.00" height="64.00" fill="#c00000" stroke="none" stroke-width="1.2" /><text x="30.00" y="30.00" font-size="19" text-anchor="start" fill="#ffffff" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Fig. 14 — PAINEL ENTRE CONTRAFORTES: UMA BARRA VERTICAL EM CADA FACE</text><text x="30.00" y="52.00" font-size="13" text-anchor="start" fill="#ffffff" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">O momento vertical troca de sinal: na base traciona o lado do solo, no vão traciona o lado de fora. As duas barras ficam a 5 cm das faces (d = 9 no bloco de 14).</text><text x="270.00" y="118.00" font-size="16" text-anchor="middle" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Planta (barras verticais)</text><text x="270.00" y="156.00" font-size="12" text-anchor="middle" fill="#8d6e3f" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">▲ SOLO</text><rect x="90.00" y="170.00" width="360.00" height="168.00" fill="#d9d9d9" stroke="#7f7f7f" stroke-width="1.4" /><rect x="138.00" y="196.40" width="163.20" height="115.20" fill="#bdd7ee" stroke="#2e75b6" stroke-width="1.2" rx="5"/><rect x="325.20" y="196.40" width="96.00" height="115.20" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.0" rx="5"/><circle cx="219.60" cy="230.00" r="7.50" fill="#c00000" stroke="none" stroke-width="1"/><circle cx="219.60" cy="278.00" r="7.50" fill="#c00000" stroke="none" stroke-width="1"/><line x1="219.60" y1="170.00" x2="62.00" y2="170.00" stroke="#404040" stroke-width="0.6" /><line x1="90.00" y1="230.00" x2="62.00" y2="230.00" stroke="#404040" stroke-width="0.6" /><line x1="66.00" y1="170.00" x2="66.00" y2="230.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="59.00" y="200.00" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 59.00 200.00)">5</text><line x1="219.60" y1="278.00" x2="62.00" y2="278.00" stroke="#404040" stroke-width="0.6" /><line x1="90.00" y1="338.00" x2="62.00" y2="338.00" stroke="#404040" stroke-width="0.6" /><line x1="66.00" y1="278.00" x2="66.00" y2="338.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="59.00" y="308.00" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 59.00 308.00)">5</text><line x1="219.60" y1="230.00" x2="478.00" y2="230.00" stroke="#404040" stroke-width="0.6" /><line x1="450.00" y1="338.00" x2="478.00" y2="338.00" stroke="#404040" stroke-width="0.6" /><line x1="474.00" y1="230.00" x2="474.00" y2="338.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="481.00" y="284.00" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;" transform="rotate(-90 481.00 284.00)">d = 9</text><text x="270.00" y="362.00" font-size="12" text-anchor="middle" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">▼ face externa</text><text x="219.60" y="390.00" font-size="12" text-anchor="middle" fill="#c00000" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">barra do lado do solo → momento da base (Mdyei)</text><text x="219.60" y="408.00" font-size="12" text-anchor="middle" fill="#c00000" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">barra do lado de fora → momento do vão (Mdy)</text><text x="806.00" y="118.00" font-size="16" text-anchor="middle" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Corte (barra horizontal na canaleta)</text><polygon points="660.00,170.00 677.60,170.00 677.60,306.00 754.40,306.00 754.40,170.00 772.00,170.00 772.00,322.00 660.00,322.00" fill="#d9d9d9" stroke="#7f7f7f" stroke-width="1.4" /><rect x="677.60" y="170.00" width="76.80" height="136.00" fill="#bdd7ee" stroke="#2e75b6" stroke-width="1.0" /><circle cx="716.00" cy="266.00" r="6.50" fill="#c00000" stroke="none" stroke-width="1"/><rect x="660.00" y="322.00" width="112.00" height="80.00" fill="#d9d9d9" stroke="#7f7f7f" stroke-width="1.2" /><line x1="660.00" y1="162.00" x2="716.00" y2="162.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="688.00" y="156.00" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">7</text><line x1="716.00" y1="162.00" x2="772.00" y2="162.00" stroke="#404040" stroke-width="0.9" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="744.00" y="156.00" font-size="12" text-anchor="middle" fill="#404040" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">7</text><text x="790.00" y="270.00" font-size="13" text-anchor="start" fill="#c00000" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Ø12,5 centralizada → d = t/2 = 7</text><text x="790.00" y="290.00" font-size="12" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">atende os dois sinais do momento horizontal</text><text x="790.00" y="308.00" font-size="12" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">K = 0,5 (seção horizontal sem graute)</text><text x="790.00" y="370.00" font-size="12" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">bloco da fiada de baixo (sem graute)</text><text x="644.00" y="250.00" font-size="12" text-anchor="end" fill="#8d6e3f" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">SOLO</text><text x="790.00" y="194.00" font-size="11" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">face externa →</text><text x="40.00" y="470.00" font-size="15" text-anchor="start" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">Na obra</text><text x="40.00" y="496.00" font-size="12.5" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• Verticais: indicar em planta, corte e notas "uma barra em cada face, a 5 cm — não centralizar".</text><text x="40.00" y="520.00" font-size="12.5" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">   Com uma barra só no meio do furo, d cai de 9 para 7 e o As do momento da base sobe quase 40% (0,65 → 0,89 cm² na faixa de 45).</text><text x="40.00" y="544.00" font-size="12.5" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• Horizontais: barra centralizada na canaleta (é o que a planilha considera por padrão). Encostada na face externa só se as laterais forem apoiadas (sem momento negativo no contraforte).</text><text x="40.00" y="568.00" font-size="12.5" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">• Estribos do contraforte (Ø ≤ 6,3) vão nas juntas de assentamento; a emenda do estribo fechado fica dentro do furo grauteado.</text><text x="40.00" y="632.00" font-size="11" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">Campos das Entradas: Posição das barras verticais, Cobrimento ao eixo das barras do painel, Posição da barra horizontal.</text></svg>