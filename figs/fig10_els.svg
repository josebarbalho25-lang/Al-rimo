tyle="font-family:Arial,'DejaVu Sans',sans-serif;">5. Ieq = (Mr/Ma)³·Im + [1 − (Mr/Ma)³]·III ≤ Im</text><text x="520.00" y="268.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">6. δ0 com a carga real e Em·Ieq (igual ao Ftool com</text><text x="520.00" y="292.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">    seção bm × heq e E = Em)</text><text x="520.00" y="316.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">7. δ∞ = δ0·(1 + αf),  αf = Δξ/(1 + 50ρ'),  Δξ = 1</text><text x="520.00" y="340.00" font-size="14" text-anchor="start" fill="#262626" font-weight="bold" style="font-family:Arial,'DejaVu Sans',sans-serif;">8. Limite do balanço: 2L/250</text><text x="520.00" y="364.00" font-size="13" text-anchor="start" fill="#262626" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;"></text><text x="520.00" y="388.00" font-size="13" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">Campos: "Ma/Mk", "Limite: vão /", "Vão de referência</text><text x="520.00" y="412.00" font-size="13" text-anchor="start" fill="#595959" font-weight="normal" style="font-family:Arial,'DejaVu Sans',sans-serif;">do balanço" (2h), "Δξ", "Somar σsg no Mr?"</text></svg>