    <line x1="34" y1="13" x2="34" y2="86"/>
    <line x1="21" y1="76" x2="79" y2="76"/>
    <line x1="44" y1="31" x2="47" y2="31"/>
    <line x1="44" y1="47" x2="56" y2="47"/>
    <line x1="44" y1="63" x2="66" y2="63"/>
  </g>
</svg>
